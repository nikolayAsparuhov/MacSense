name: MacSense
options:
  bundleIdPrefix: tech.veraio
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: "NO"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: "Automatic"
    DEVELOPMENT_TEAM: "HELVICA000"
    CODE_SIGN_ENTITLEMENTS: "MacSense/MacSense.entitlements"
    INFOPLIST_FILE: "MacSense/Info.plist"
    PRODUCT_BUNDLE_IDENTIFIER: "tech.veraio.macsense"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    COMBINE_HIDPI_IMAGES: "YES"

targets:
  MacSense:
    type: application
    platform: macOS
    sources:
      - MacSense
    settings:
      base:
        PRODUCT_NAME: MacSense
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: "MacSense/MacSense-Bridging-Header.h"
        CLANG_ENABLE_MODULES: "YES"
        GCC_OPTIMIZATION_LEVEL: "s"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
