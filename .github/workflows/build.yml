name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (Debug, macOS)
        run: |
          set -o pipefail
          xcodebuild \
            -project MacSense.xcodeproj \
            -scheme MacSense \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Fail on warnings
        run: |
          if grep -E "warning:|error:" build.log \
              | grep -v "Metadata extraction\|matching destinations\|RegisterExecutionPolicy"; then
            echo "::error::Build had warnings or errors above"
            exit 1
          fi
